openapi: 3.0.3
info:
  title: EduConecta — escolar
  version: "1.0.0"
  description: >
    API de gestão escolar do EduConecta: alunos, turmas, encarregados de
    educação, profissionais e as associações entre eles. Todas as rotas,
    exceto /health e /ready, exigem um token Bearer emitido pelo serviço
    auth (POST /login) e são filtradas por perfil — ver a descrição de cada
    rota para saber quem pode chamá-la. A autorização é feita centralmente
    em controllers/blueprint.py (verificar_acesso_escolar), que valida o
    token contra o serviço auth antes de qualquer rota correr.
servers:
  - url: /

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Erro:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required: [error, message]

    Aluno:
      type: object
      properties:
        id: { type: string }
        nome: { type: string }
        numero_processo: { type: string }
        data_nascimento:
          type: string
          format: date
          nullable: true
          description: "Formato AAAA-MM-DD; opcional, não pode ser no futuro."
        morada: { type: string, description: "Opcional, até 200 caracteres." }

    AlunoComTurma:
      allOf:
        - $ref: '#/components/schemas/Aluno'
        - type: object
          properties:
            turma_id:
              type: string
              nullable: true

    Turma:
      type: object
      properties:
        id: { type: string }
        nome: { type: string }
        ano_letivo: { type: string, example: "2025/2026" }
        tipo:
          type: string
          enum: [creche, basico]
          description: "creche aceita diário e faltas; basico só aceita faltas."
        capacidade:
          type: integer
          nullable: true
          description: "Opcional, entre 1 e 1000. Só informativo — não há limite imposto ao associar alunos."

    Encarregado:
      type: object
      properties:
        id: { type: string }
        nome: { type: string }
        cc: { type: string, description: "Número do cartão de cidadão." }
        telemovel: { type: string }
        morada: { type: string, description: "Opcional, até 200 caracteres." }
        relacao:
          type: string
          nullable: true
          enum: [mae, pai, tutor, outro]
          description: "Relação do encarregado com o(s) seu(s) educando(s); opcional."

    Profissional:
      type: object
      properties:
        id: { type: string }
        nome: { type: string }
        perfil: { type: string, enum: [docente, educadora, auxiliar] }
        cc: { type: string, description: "Número do cartão de cidadão." }
        telemovel: { type: string }
        utilizador_id: { type: string, nullable: true }
        morada: { type: string, description: "Opcional, até 200 caracteres." }
        data_admissao:
          type: string
          format: date
          nullable: true
          description: "Formato AAAA-MM-DD; opcional."

  responses:
    NaoAutenticado:
      description: >
        Sem token, token mal formado, expirado ou inválido (error pode ser
        authentication_required, invalid_session ou token_expired/invalid_token).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    SemPermissao:
      description: O perfil autenticado não tem permissão para esta operação (error "forbidden", ou um motivo mais específico descrito na rota).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    ServicoIndisponivel:
      description: A base de dados Atlas, ou o serviço auth/escolar consultado internamente, não respondeu.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    JsonInvalido:
      description: Content-Type não é application/json (415), ou o corpo não é um objeto JSON válido (400).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Liveness check
      description: Responde sempre 200 se o processo estiver a correr. Sem autenticação.
      security: []
      tags: [monitorização]
      responses:
        "200":
          description: Serviço no ar.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: escolar }
                  application: { type: string, example: EduConecta }

  /ready:
    get:
      summary: Readiness check
      description: 200 só se a ligação ao MongoDB Atlas estiver mesmo a funcionar. Sem autenticação.
      security: []
      tags: [monitorização]
      responses:
        "200":
          description: Base de dados acessível.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ready }
                  service: { type: string }
                  database: { type: string, example: connected }
        "503":
          description: Base de dados inacessível.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: not_ready }
                  service: { type: string }
                  database: { type: string, example: unavailable }

  /alunos:
    get:
      summary: Listar alunos
      description: "Lista até 50 alunos. **Perfil: admin apenas.**"
      tags: [alunos]
      responses:
        "200":
          description: Lista de alunos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  alunos: { type: array, items: { $ref: '#/components/schemas/Aluno' } }
                  quantidade: { type: integer }
                  limite: { type: integer, example: 50 }
        "401": { $ref: '#/components/responses/NaoAutenticado' }
        "403": { $ref: '#/components/responses/SemPermissao' }
        "503": { $ref: '#/components/responses/ServicoIndisponivel' }
    post:
      summary: Criar aluno
      description: >-
        Cria um aluno. **Perfil: admin apenas.** numero_processo é único.
        data_nascimento e morada são opcionais.
      tags: [alunos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, numero_processo]
              properties:
                nome: { type: string, minLength: 2, maxLength: 150 }
                numero_processo: { type: string, minLength: 1, maxLength: 50 }
                data_nascimento: { type: string, format: date, description: "Formato AAAA-MM-DD; opcional, não pode ser no futuro." }
                morada: { type: string, maxLength: 200, description: "Opcional." }
      responses:
        "201":
          description: Aluno criado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Aluno' }
        "400": { $ref: '#/components/responses/JsonInvalido' }
        "401": { $ref: '#/components/responses/NaoAutenticado' }
        "403": { $ref: '#/components/responses/SemPermissao' }
        "409":
          description: Já existe um aluno com esse número de processo (error duplicate_process_number).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        "415": { $ref: '#/components/responses/JsonInvalido' }
        "503": { $ref: '#/components/responses/ServicoIndisponivel' }

  /alunos/{aluno_id}:
    parameters:
      - name: aluno_id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Consultar aluno
      description: "Devolve um aluno pelo id. **Perfil: admin apenas.**"
      tags: [alunos]
      responses:
        "200":
          description: Aluno encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Aluno' }
        "400":
          description: aluno_id não é um ObjectId válido (error invalid_student_id).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        "401": { $ref: '#/components/responses/NaoAutenticado' }
        "403": { $ref: '#/components/responses/SemPermissao' }
        "404":
          description: Aluno não encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        "503": { $ref: '#/components/responses/ServicoIndisponivel' }
    patch:
      summary: Atualizar aluno
      description: >-
        Atualização parcial de nome, numero_processo, data_nascimento e/ou
        morada. **Perfil: admin, ou um profissional (docente/educadora/
        auxiliar) atribuído à turma atual do aluno** — um profissional de
        outra turma recebe 403.
      tags: [alunos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                nome: { type: string }
                numero_processo: { type: string }
                data_nascimento: { type: string, format: date, nullable: true }
                morada: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Aluno atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Aluno' }
        "400": { $ref: '#/components/responses/JsonInvalido' }
        "401": { $ref: '#/components/responses/NaoAutenticado' }
        "403":
          description: >-
            Perfil sem permissão, ou profissional não atribuído à turma do
            aluno (error forbidden).
          content:
            application/json: { schema: { $ref: '#/components/schemas/Erro' } }
        "404":
          description: Aluno não encontrado (ou já eliminado).
          content:
            application/json: { schema: { $ref: '#/components/schemas/Erro' } }
        "409":
          description: numero_processo já usado por outro aluno.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Erro' } }
        "415": { $ref: '#/components/responses/JsonInvalido' }
        "503": { $ref: '#/components/responses/ServicoIndisponivel' }
    delete:
      summary: Eliminar aluno
      description: >-
        Soft delete (RF10) — o aluno fica marcado como eliminado e deixa de
        aparecer em qualquer consulta, mas o documento não é removido da
        base de dados. **Perfil: admin apenas.** Registos de outros serviços
        (diário, assiduidade) que referenciam este aluno não são afetados.
      tags: [alunos]
      responses:
        "200":
          description: Aluno eliminado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  eliminado: { type: boolean, example: true }
        "400": { $ref: '#/components/responses/JsonInvalido' }
        "401": { $ref: '#/components/responses/NaoAutenticado' }
        "403": { $ref: '#/components/responses/SemPermissao' }
        "404":
          description: Aluno não encontrado (ou já estava eliminado).
          content:
            application/json: { schema: { $ref: '#/components/schemas/Erro' } }
        "503": { $ref: '#/components/responses/ServicoIndisponivel' }

  /alunos/{aluno_id}/turma:
    put:
      summary: Atribuir turma ao aluno
      description: "Define (ou substitui) a turma de um aluno. **Perfil: admin apenas.**"
      tags: [alunos, turmas]
      parameters:
        - name: aluno_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [turma_id]
              properties:
                turma_id: { type: string }
      responses:
        "200":
          description: Aluno associado à turma.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Aluno'
                  - type: object
                    properties:
                      turma: { $ref: '#/components/schemas/Turma' }
        "400": { $ref: '#/components/responses/JsonInvalido' }
        "401": { $ref: '#/components/responses/NaoAutenticado' }
        "403": { $ref: '#/components/responses/SemPermissao' }
        "404":
          description: Turma ou aluno não encontrados (error class_not_found ou student_not_found).
          content:
            application/json: { schema: { $ref: '#/components/schemas/Erro' } }
        "415": { $ref: '#/components/responses/JsonInvalido' }
        "503": { $ref: '#/components/responses/ServicoIndisponivel' }

  /alunos/{aluno_id}/encarregados/{encarregado_id}:
    put:
      summary: Associar encarregado a aluno
      description: "Liga um encarregado de educação a um aluno (um aluno pode ter vários). **Perfil: admin apenas.**"
      tags: [alunos, encarregados]
      parameters:
        - name: aluno_id
          in: path
          required: true
          schema: { type: string }
        - name: encarregado_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Associação confirmada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  aluno: { $ref: '#/components/schemas/Aluno' }
                  encarregado: { $ref: '#/components/schemas/Encarregado' }
                  message: { type: string }
        "400":
          description: aluno_id ou encarregado_id inválidos.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Erro' } }
        "401": { $ref: '#/components/responses/NaoAutenticado' }
        "403": { $ref: '#/components/responses/SemPermissao' }
        "404":
          description: Aluno ou encarregado não encontrados.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Erro' } }
        "503": { $ref: '#/components/responses/ServicoIndisponivel' }

  /alunos/{aluno_id}/encarregados:
    get:
      summary: Listar encarregados de um aluno
      description: "Lista os encarregados de educação associados a um aluno. **Perfil: admin apenas.**"
      tags: [alunos, encarregados]
      parameters:
        - name: aluno_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Lista de encarregados do aluno.
          content:
            application/json:
              schema:
                type: object
                properties:
                  aluno:
                    type: object
                    properties:
                      id: { type: string }
                      nome: { type: string }
                  encarregados: { type: array, items: { $ref: '#/components/schemas/Encarregado' } }
                  quantidade: { type: integer }
                  limite: { type: integer }
        "400":
          description: aluno_id inválido.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Erro' } }
        "401": { $ref: '#/components/responses/NaoAutenticado' }
        "403": { $ref: '#/components/responses/SemPermissao' }
        "404":
          description: Aluno não encontrado.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Erro' } }
        "503": { $ref: '#/components/responses/ServicoIndisponivel' }

  /me/alunos:
    get:
      summary: Listar os meus educandos
      description: >
        Lista os educandos do encarregado autenticado. **Perfil: encarregado**
        (rota pessoal — listada em PERMISSOES_PESSOAIS, não precisa de admin).
        Devolve 403 (school_profile_not_linked) se a conta ainda não tiver um
        registo de encarregado associado.
      tags: [alunos]
      responses:
        "200":
          description: Educandos do encarregado autenticado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  encarregado:
                    type: object
                    properties:
                      id: { type: string }
                      nome: { type: string }
                  alunos: { type: array, items: { $ref: '#/components/schemas/AlunoComTurma' } }
                  quantidade: { type: integer }
                  limite: { type: integer }
        "401": { $ref: '#/components/responses/NaoAutenticado' }
        "403": { $ref: '#/components/responses/SemPermissao' }
        "503": { $ref: '#/components/responses/ServicoIndisponivel' }

  /turmas:
    post:
      summary: Criar turma
      description: >
        Cria uma turma. **Perfil: admin apenas.** ano_letivo tem de ter o
        formato "AAAA/AAAA" com dois anos consecutivos (ex: "2025/2026").
        tipo é obrigatório: "creche" (aceita diário e faltas) ou "basico"
        (só aceita faltas — o serviço diario recusa turmas deste tipo).
        capacidade é opcional e só informativa (1 a 1000) — não há limite
        imposto ao associar alunos à turma.
      tags: [turmas]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, ano_letivo, tipo]
              properties:
                nome: { type: string, minLength: 1, maxLength: 100 }
                ano_letivo: { type: string, example: "2025/2026" }
                tipo: { type: string, enum: [creche, basico] }
                capacidade: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        "201":
          description: Turma criada.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Turma' } }
        "400": { $ref: '#/components/responses/JsonInvalido' }
        "401": { $ref: '#/components/responses/NaoAutenticado' }
        "403": { $ref: '#/components/responses/SemPermissao' }
        "409":
          description: Já existe uma turma com esse nome nesse ano letivo.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Erro' } }
        "415": { $ref: '#/components/responses/JsonInvalido' }
        "503": { $ref: '#/components/responses/ServicoIndisponivel' }
    get:
      summary: Listar turmas
      description: "Lista até 50 turmas. **Perfil: admin apenas.**"
      tags: [turmas]
      responses:
        "200":
          description: Lista de turmas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  turmas: { type: array, items: { $ref: '#/components/schemas/Turma' } }
                  quantidade: { type: integer }
                  limite: { type: integer }
        "401": { $ref: '#/components/responses/NaoAutenticado' }
        "403": { $ref: '#/components/responses/SemPermissao' }
        "503": { $ref: '#/components/responses/ServicoIndisponivel' }

  /turmas/{turma_id}:
    get:
      summary: Consultar detalhe de uma turma
      description: >-
        Devolve a turma e os profissionais atribuídos. Não há distinção
        entre eles (ex: "diretor de turma") — qualquer um pode fazer tudo o
        que a turma permite ao seu perfil, incluindo decidir justificações de
        faltas no serviço assiduidade. **Perfil: admin (qualquer turma), ou
        um profissional atribuído a essa turma** — para as restantes, devolve
        404 em vez de 403, para não revelar que a turma existe a quem não tem
        acesso.
      tags: [turmas]
      parameters:
        - name: turma_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Detalhe da turma.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Turma'
                  - type: object
                    properties:
                      profissionais:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            nome: { type: string }
                            perfil: { type: string, enum: [docente, educadora, auxiliar] }
        "400":
          description: turma_id inválido.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Erro' } }
        "401": { $ref: '#/components/responses/NaoAutenticado' }
        "404":
          description: Turma não encontrada (ou não acessível a este profissional).
          content:
            application/json: { schema: { $ref: '#/components/schemas/Erro' } }
        "503": { $ref: '#/components/responses/ServicoIndisponivel' }

  /turmas/{turma_id}/alunos:
    get:
      summary: Listar alunos de uma turma (admin)
      description: "Lista os alunos de qualquer turma. **Perfil: admin apenas.**"
      tags: [turmas, alunos]
      parameters:
        - name: turma_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Turma + alunos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  turma: { $ref: '#/components/schemas/Turma' }
                  alunos: { type: array, items: { $ref: '#/components/schemas/Aluno' } }
                  quantidade: { type: integer }
                  limite: { type: integer }
        "400":
          description: turma_id inválido.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Erro' } }
        "401": { $ref: '#/components/responses/NaoAutenticado' }
        "403": { $ref: '#/components/responses/SemPermissao' }
        "404":
          description: Turma não encontrada.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Erro' } }
        "503": { $ref: '#/components/responses/ServicoIndisponivel' }

  /turmas/{turma_id}/profissionais/{profissional_id}:
    put:
      summary: Associar profissional a turma
      description: >
        Atribui um profissional a uma turma. **Perfil: admin apenas.** Antes
        de gravar, confirma junto do serviço auth que a conta ligada ao
        profissional está ativa e que o perfil da conta ainda corresponde ao
        perfil guardado no registo profissional. Uma turma só pode ter um
        docente (perfil "docente") atribuído de cada vez — não há limite
        para educadora/auxiliar.
      tags: [turmas, profissionais]
      parameters:
        - name: turma_id
          in: path
          required: true
          schema: { type: string }
        - name: profissional_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Profissional associado à turma.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  turma: { $ref: '#/components/schemas/Turma' }
                  profissional: { $ref: '#/components/schemas/Profissional' }
        "400":
          description: turma_id ou profissional_id inválidos.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Erro' } }
        "401": { $ref: '#/components/responses/NaoAutenticado' }
        "403": { $ref: '#/components/responses/SemPermissao' }
        "404":
          description: Turma ou profissional não encontrados.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Erro' } }
        "409":
          description: >-
            Profissional sem conta válida associada, ou conta
            inativa/perfil não corresponde (error account_not_valid), ou a
            turma já tem um docente atribuído e este profissional também é
            docente (error class_already_has_teacher).
          content:
            application/json: { schema: { $ref: '#/components/schemas/Erro' } }
        "503": { $ref: '#/components/responses/ServicoIndisponivel' }

  /me/turmas:
    get:
      summary: Listar as minhas turmas
      description: >
        Lista as turmas atribuídas ao profissional autenticado. **Perfil:
        docente, educadora, auxiliar** (rota pessoal). Devolve 403
        (professional_profile_not_linked ou professional_profile_mismatch) se
        a conta não tiver um registo profissional correspondente.
      tags: [turmas]
      responses:
        "200":
          description: Turmas do profissional autenticado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profissional:
                    type: object
                    properties:
                      id: { type: string }
                      nome: { type: string }
                      perfil: { type: string }
                  turmas: { type: array, items: { $ref: '#/components/schemas/Turma' } }
                  quantidade: { type: integer }
                  limite: { type: integer }
        "401": { $ref: '#/components/responses/NaoAutenticado' }
        "403": { $ref: '#/components/responses/SemPermissao' }
        "503": { $ref: '#/components/responses/ServicoIndisponivel' }

  /me/turmas/{turma_id}/alunos:
    get:
      summary: Listar alunos de uma das minhas turmas
      description: >
        Lista os alunos de uma turma do profissional autenticado. **Perfil:
        docente, educadora, auxiliar.** Devolve 404 (não 403) se a turma
        existir mas não pertencer ao profissional — de propósito, para não
        revelar a outros utilizadores quais turmas existem.
      tags: [turmas, alunos]
      parameters:
        - name: turma_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Turma + alunos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  turma: { $ref: '#/components/schemas/Turma' }
                  alunos: { type: array, items: { $ref: '#/components/schemas/AlunoComTurma' } }
                  quantidade: { type: integer }
                  limite: { type: integer }
        "400":
          description: turma_id inválido.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Erro' } }
        "401": { $ref: '#/components/responses/NaoAutenticado' }
        "403": { $ref: '#/components/responses/SemPermissao' }
        "404":
          description: Turma inexistente ou não atribuída a este profissional.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Erro' } }
        "503": { $ref: '#/components/responses/ServicoIndisponivel' }

  /encarregados:
    post:
      summary: Criar encarregado de educação (+ conta de login)
      description: >
        Cria o registo de encarregado de educação E a sua conta de login
        (perfil "encarregado") num único pedido: o serviço auth gera a
        conta e envia uma password temporária para o email indicado, tal
        como já acontece para docentes/educadoras/auxiliares em
        POST /admin/utilizadores (serviço auth). **Perfil: admin apenas.**
        PUT /encarregados/{id}/utilizador continua a existir, mas só serve
        para ligar uma conta já existente — não é preciso para o fluxo normal.
        telemovel, morada e relacao são opcionais.
      tags: [encarregados]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, email, cc]
              properties:
                nome: { type: string, minLength: 2, maxLength: 150 }
                email: { type: string, format: email }
                cc: { type: string, minLength: 5, maxLength: 30, description: "Número do cartão de cidadão." }
                telemovel: { type: string, maxLength: 30 }
                morada: { type: string, maxLength: 200 }
                relacao: { type: string, enum: [mae, pai, tutor, outro] }
      responses:
        "201":
          description: Encarregado e conta de login criados; email com a password temporária enviado.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Encarregado'
                  - type: object
                    properties:
                      utilizador_id: { type: string }
                      email: { type: string }
                      estado: { type: string }
                      deve_alterar_password: { type: boolean }
        "400": { $ref: '#/components/responses/JsonInvalido' }
        "401": { $ref: '#/components/responses/NaoAutenticado' }
        "403": { $ref: '#/components/responses/SemPermissao' }
        "409":
          description: Já existe uma conta com esse email (error email_already_registered).
          content:
            application/json: { schema: { $ref: '#/components/schemas/Erro' } }
        "415": { $ref: '#/components/responses/JsonInvalido' }
        "503":
          description: >-
            Serviço auth indisponível, email não configurado, ou base de
            dados indisponível (nesse último caso, a conta de login pode já
            ter sido criada — ver utilizador_id na resposta).
          content:
            application/json: { schema: { $ref: '#/components/schemas/Erro' } }
    get:
      summary: Listar encarregados de educação
      description: "Lista até 50 encarregados de educação. **Perfil: admin apenas.**"
      tags: [encarregados]
      responses:
        "200":
          description: Lista de encarregados.
          content:
            application/json:
              schema:
                type: object
                properties:
                  encarregados: { type: array, items: { $ref: '#/components/schemas/Encarregado' } }
                  quantidade: { type: integer }
                  limite: { type: integer }
        "401": { $ref: '#/components/responses/NaoAutenticado' }
        "403": { $ref: '#/components/responses/SemPermissao' }
        "503": { $ref: '#/components/responses/ServicoIndisponivel' }

  /encarregados/{encarregado_id}/alunos:
    get:
      summary: Listar educandos de um encarregado (admin)
      description: "Lista os educandos de um encarregado por id. **Perfil: admin apenas.**"
      tags: [encarregados, alunos]
      parameters:
        - name: encarregado_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Encarregado + educandos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  encarregado:
                    type: object
                    properties:
                      id: { type: string }
                      nome: { type: string }
                  alunos: { type: array, items: { $ref: '#/components/schemas/AlunoComTurma' } }
                  quantidade: { type: integer }
                  limite: { type: integer }
        "400":
          description: encarregado_id inválido.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Erro' } }
        "401": { $ref: '#/components/responses/NaoAutenticado' }
        "403": { $ref: '#/components/responses/SemPermissao' }
        "404":
          description: Encarregado não encontrado.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Erro' } }
        "503": { $ref: '#/components/responses/ServicoIndisponivel' }

  /encarregados/{encarregado_id}/utilizador:
    put:
      summary: Associar conta de utilizador a um encarregado
      description: >
        Liga uma conta de utilizador (perfil "encarregado", já criada no
        auth) a este registo de encarregado. **Perfil: admin apenas** (dupla
        verificação: pelo before_request do blueprint e, redundantemente,
        dentro da própria rota — comportamento preservado tal como estava no
        código original antes do refactor para MVC).
      tags: [encarregados]
      parameters:
        - name: encarregado_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [utilizador_id]
              properties:
                utilizador_id: { type: string }
      responses:
        "200":
          description: Conta associada ao encarregado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  encarregado:
                    type: object
                    properties:
                      id: { type: string }
                      nome: { type: string }
                      utilizador_id: { type: string }
        "400": { $ref: '#/components/responses/JsonInvalido' }
        "401": { $ref: '#/components/responses/NaoAutenticado' }
        "403": { $ref: '#/components/responses/SemPermissao' }
        "404":
          description: Encarregado ou conta de utilizador não encontrados.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Erro' } }
        "409":
          description: Perfil da conta não é "encarregado", conta inativa, encarregado já associado a outra conta, ou conta já associada a outro encarregado.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Erro' } }
        "415": { $ref: '#/components/responses/JsonInvalido' }
        "503": { $ref: '#/components/responses/ServicoIndisponivel' }

  /profissionais:
    post:
      summary: Criar profissional (+ conta de login)
      description: >
        Cria o registo de profissional (docente, educadora ou auxiliar) E a
        sua conta de login, num único pedido: o auth cria a conta com o
        perfil indicado e envia uma password temporária para o email —
        mesmo fluxo de POST /encarregados. **Perfil: admin apenas.**
        telemovel, morada e data_admissao são opcionais.
      tags: [profissionais]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, email, cc, perfil]
              properties:
                nome: { type: string, minLength: 2, maxLength: 150 }
                email: { type: string, format: email }
                cc: { type: string, minLength: 5, maxLength: 30, description: "Número do cartão de cidadão." }
                telemovel: { type: string, maxLength: 30 }
                perfil: { type: string, enum: [docente, educadora, auxiliar] }
                morada: { type: string, maxLength: 200 }
                data_admissao: { type: string, format: date }
      responses:
        "201":
          description: Profissional e conta de login criados; email com a password temporária enviado.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Profissional'
                  - type: object
                    properties:
                      cc: { type: string }
                      telemovel: { type: string }
                      email: { type: string }
                      estado: { type: string }
                      deve_alterar_password: { type: boolean }
        "400":
          description: Campo em falta/inválido (nome, email, cc, telemovel ou perfil).
          content:
            application/json: { schema: { $ref: '#/components/schemas/Erro' } }
        "401": { $ref: '#/components/responses/NaoAutenticado' }
        "403": { $ref: '#/components/responses/SemPermissao' }
        "409":
          description: Já existe uma conta com esse email (error email_already_registered).
          content:
            application/json: { schema: { $ref: '#/components/schemas/Erro' } }
        "415": { $ref: '#/components/responses/JsonInvalido' }
        "503":
          description: >-
            Serviço auth indisponível, email não configurado, ou base de
            dados indisponível (a conta de login pode já ter sido criada —
            ver utilizador_id na resposta).
          content:
            application/json: { schema: { $ref: '#/components/schemas/Erro' } }
    get:
      summary: Listar profissionais
      description: "Lista até 50 profissionais. **Perfil: admin apenas.**"
      tags: [profissionais]
      responses:
        "200":
          description: Lista de profissionais.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profissionais: { type: array, items: { $ref: '#/components/schemas/Profissional' } }
                  quantidade: { type: integer }
                  limite: { type: integer }
        "401": { $ref: '#/components/responses/NaoAutenticado' }
        "403": { $ref: '#/components/responses/SemPermissao' }
        "503": { $ref: '#/components/responses/ServicoIndisponivel' }

  /me/chat/validar:
    post:
      summary: Validar participantes de uma conversa
      description: >
        Confirma que a conta autenticada pode participar numa conversa sobre
        um aluno concreto, validando a cadeia inteira
        profissional↔turma↔aluno↔encarregado (não só os IDs recebidos). Usado
        pelo serviço comunicados antes de abrir/usar uma conversa — esta rota
        não guarda nenhuma conversa, só valida a legitimidade da relação.
        **Perfil: docente, educadora, encarregado** (rota pessoal — a conta
        autenticada tem de ser um dos dois participantes indicados no pedido).
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aluno_id, profissional_utilizador_id, encarregado_utilizador_id]
              properties:
                aluno_id: { type: string }
                profissional_utilizador_id: { type: string }
                encarregado_utilizador_id: { type: string }
      responses:
        "200":
          description: Conversa legítima.
          content:
            application/json:
              schema:
                type: object
                properties:
                  autorizado: { type: boolean, example: true }
                  aluno_id: { type: string }
                  turma_id: { type: string }
                  profissional_utilizador_id: { type: string }
                  encarregado_utilizador_id: { type: string }
        "400": { $ref: '#/components/responses/JsonInvalido' }
        "401": { $ref: '#/components/responses/NaoAutenticado' }
        "403":
          description: Conta não é participante válido da conversa indicada, ou o perfil não corresponde ao registo profissional (error forbidden).
          content:
            application/json: { schema: { $ref: '#/components/schemas/Erro' } }
        "404":
          description: A cadeia de relações não fecha (aluno não é educando deste encarregado, ou turma não é lecionada por este profissional).
          content:
            application/json: { schema: { $ref: '#/components/schemas/Erro' } }
        "415": { $ref: '#/components/responses/JsonInvalido' }
        "503": { $ref: '#/components/responses/ServicoIndisponivel' }
