name: educonecta

services:
  escolar:
    build:
      context: ./backend/services/escolar
    environment:
      MONGO_URI: ${MONGO_URI:?Falta MONGO_URI no .env}
      MONGO_ESCOLAR_DATABASE: ${MONGO_ESCOLAR_DATABASE:?Falta MONGO_ESCOLAR_DATABASE no .env}
    ports:
      - "127.0.0.1:5001:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  auth:
    env_file:
      - .env.smtp
    build:
      context: ./backend/services/auth
    environment:
      MONGO_URI: ${MONGO_URI:?Falta MONGO_URI no .env}
      MONGO_AUTH_DATABASE: ${MONGO_AUTH_DATABASE:?Falta MONGO_AUTH_DATABASE no .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Falta JWT_SECRET_KEY no .env}
    ports:
      - "127.0.0.1:5002:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  diario:
    build:
      context: ./backend/services/diario
    environment:
      MONGO_URI: ${MONGO_URI:?Falta MONGO_URI no .env}
      MONGO_DIARIO_DATABASE: ${MONGO_DIARIO_DATABASE:?Falta MONGO_DIARIO_DATABASE no .env}
    ports:
      - "127.0.0.1:5003:8000"
    depends_on:
      auth:
        condition: service_healthy
      escolar:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s


  comunicados:
    build:
      context: ./backend/services/comunicados
    environment:
      MONGO_URI: ${MONGO_URI:?Falta MONGO_URI no .env}
      MONGO_COMUNICADOS_DATABASE: ${MONGO_COMUNICADOS_DATABASE:?Falta MONGO_COMUNICADOS_DATABASE no .env}
    ports:
      - "127.0.0.1:5004:8000"
    depends_on:
      auth:
        condition: service_healthy
      escolar:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  assiduidade:
    build:
      context: ./backend/services/assiduidade
    environment:
      MONGO_URI: ${MONGO_URI:?Falta MONGO_URI no .env}
      MONGO_ASSIDUIDADE_DATABASE: ${MONGO_ASSIDUIDADE_DATABASE:?Falta MONGO_ASSIDUIDADE_DATABASE no .env}
    ports:
      - "127.0.0.1:5005:8000"
    depends_on:
      auth:
        condition: service_healthy
      escolar:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/ready', timeout=3).close()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
