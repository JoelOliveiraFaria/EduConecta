name: educonecta

services:
  school:
    build:
      context: ./backend/services/school
    environment:
      MONGO_HOST: mongo-school
      MONGO_PORT: "27017"
      MONGO_SCHOOL_USERNAME: ${MONGO_SCHOOL_USERNAME:?Falta MONGO_SCHOOL_USERNAME no .env}
      MONGO_SCHOOL_PASSWORD: ${MONGO_SCHOOL_PASSWORD:?Falta MONGO_SCHOOL_PASSWORD no .env}
      MONGO_SCHOOL_DATABASE: ${MONGO_SCHOOL_DATABASE:?Falta MONGO_SCHOOL_DATABASE no .env}
    ports:
      - "127.0.0.1:5001:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  auth:
    env_file:
      - .env.smtp
    build:
      context: ./backend/services/auth
    environment:
      MONGO_HOST: mongo-school
      MONGO_PORT: "27017"
      MONGO_AUTH_USERNAME: ${MONGO_AUTH_USERNAME:?Falta MONGO_AUTH_USERNAME no .env}
      MONGO_AUTH_PASSWORD: ${MONGO_AUTH_PASSWORD:?Falta MONGO_AUTH_PASSWORD no .env}
      MONGO_AUTH_DATABASE: ${MONGO_AUTH_DATABASE:?Falta MONGO_AUTH_DATABASE no .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Falta JWT_SECRET_KEY no .env}
    ports:
      - "127.0.0.1:5002:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  mongo-school:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Falta MONGO_ROOT_USERNAME no .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Falta MONGO_ROOT_PASSWORD no .env}
    volumes:
      - school_mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.adminCommand({ping: 1}).ok ? 0 : 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  school_mongo_data: